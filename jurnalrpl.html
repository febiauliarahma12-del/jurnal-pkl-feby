<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurnal PKL RPL - SMKN 2 Cipatujah</title>
<style>
:root{--ink:#12263a;--ink2:#1d3b57;--bg:#f2f5f8;--card:#fff;--line:#d9e1e9;--text:#1b2733;--mute:#5d6b79;--teal:#0e7c86;--teal-d:#0a5f67;--amber:#f2b84b;--red:#b42318;--green:#15803d;--r:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3{line-height:1.25;margin:0}
button,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{background:var(--ink);color:#fff;border-bottom:6px solid var(--amber);padding:22px 0 20px}
.top h1{font-size:clamp(1.7rem,6vw,2.5rem);letter-spacing:-.02em}
.top p.sub{margin:4px 0 16px;color:#b8c7d6}
.ident{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0;padding:14px 16px;background:var(--ink2);border-radius:var(--r)}
.ident div{min-width:0}
.ident dt{font-size:.78rem;color:#9fb3c6}
.ident dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.top .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-weight:600;cursor:pointer}
.btn:hover{background:#eef3f7}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:#8f1c12}
.btn.ghost{background:transparent;color:#fff;border-color:#4d6a85}
.btn.ghost:hover{background:#26475f}
.btn.sm{min-height:38px;padding:0 12px;font-size:.9rem}
.btn.warn-o{color:var(--red);border-color:#e6b3ad}
main{padding:20px 0 40px;display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:1.15rem;margin-bottom:14px}
.recap{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.recap .it{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:var(--r);padding:12px 14px}
.recap b{display:block;font-size:1.6rem;line-height:1.2}
.recap span{color:var(--mute);font-size:.88rem}
.layout{display:grid;gap:20px}
label{display:block;font-weight:600;margin:0 0 4px;font-size:.93rem}
.req{color:var(--red)}
input[type=text],input[type=date],input[type=time],input[type=search],textarea{width:100%;padding:10px 12px;border:1px solid #b9c5d1;border-radius:10px;background:#fff;color:var(--text)}
textarea{min-height:84px;resize:vertical}
.f{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{display:none;color:var(--red);font-size:.85rem;margin-top:4px}
.invalid input,.invalid textarea{border-color:var(--red);background:#fff6f5}
.invalid .err{display:block}
.hint{color:var(--mute);font-size:.82rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.tools{display:grid;gap:12px;margin-bottom:14px}
.tools .dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.count{color:var(--mute);font-size:.9rem}
.entry{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;background:#fff}
.entry.editing{border-color:var(--amber);box-shadow:0 0 0 3px #f2b84b55}
.entry .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.entry .date{font-weight:700}
.entry .time{color:var(--teal-d);font-weight:600;font-size:.9rem}
.tag{display:inline-block;font-size:.75rem;background:#fdf0d0;color:#7a5600;border-radius:99px;padding:1px 8px;margin-left:6px;font-weight:600}
.entry dl{margin:0;display:grid;gap:8px}
.entry dt{font-size:.8rem;font-weight:700;color:var(--mute)}
.entry dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.entry .ea{display:flex;gap:8px;margin-top:12px}
.empty{text-align:center;padding:36px 16px;color:var(--mute);border:2px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--text);margin-bottom:6px}
#toasts{position:fixed;left:12px;right:12px;bottom:14px;display:grid;gap:8px;z-index:50;pointer-events:none;justify-items:center}
.toast{pointer-events:auto;max-width:460px;width:100%;padding:12px 16px;border-radius:10px;color:#fff;font-weight:600;box-shadow:0 6px 20px #0003}
.toast.ok{background:var(--green)}.toast.bad{background:var(--red)}.toast.info{background:var(--ink2)}
.modal{position:fixed;inset:0;background:#0b1a2a99;display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal[hidden]{display:none}
.modal .box{background:#fff;border-radius:var(--r);padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.modal h2{margin-bottom:8px}
.modal .btns{justify-content:flex-end;margin-top:16px}
.pnote{display:none}
.psign{display:none}
@media(min-width:700px){.recap{grid-template-columns:repeat(4,1fr)}.ident{grid-template-columns:repeat(3,1fr)}.tools{grid-template-columns:1.4fr 1fr}}
@media(min-width:960px){.layout{grid-template-columns:380px 1fr;align-items:start}.formcard{position:sticky;top:12px}}
@media(prefers-reduced-motion:no-preference){.toast{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
@page{size:A4;margin:15mm}
@media print{
 body{background:#fff;color:#000;font-size:11pt}
 .noprint,#toasts,.modal,.recap,.formcard,.tools,.entry .ea,.tag{display:none!important}
 header.top{background:#fff;color:#000;border-bottom:2px solid #000;padding:0 0 8px}
 .top p.sub{color:#000;margin-bottom:8px}
 .ident{background:#fff;border:1px solid #000;border-radius:0;grid-template-columns:1fr 1fr;padding:8px}
 .ident dt{color:#333}
 main{padding:10px 0;display:block}
 .layout{display:block}
 .card{border:0;padding:0}
 .listhead h2{font-size:13pt}
 .entry{border:1px solid #000;border-radius:0;break-inside:avoid;margin-bottom:8px;padding:8px}
 .entry.editing{box-shadow:none;border-color:#000}
 .entry .time{color:#000}
 .pnote{display:block;margin:8px 0;font-size:10pt}
 .psign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:24px;text-align:center;break-inside:avoid}
 .psign div{min-height:110px}
 .psign u{display:inline-block;min-width:160px}
}
</style>
</head>
<body>

<header class="top">
 <div class="wrap">
  <h1>Jurnal PKL</h1>
  <p class="sub">Program Keahlian Rekayasa Perangkat Lunak, SMKN 2 Cipatujah</p>
  <dl class="ident" id="ident"></dl>
  <div class="acts noprint">
   <button class="btn ghost" id="btnIdent" type="button">Ubah identitas</button>
   <button class="btn primary" id="btnPrint" type="button">Cetak jurnal</button>
  </div>
 </div>
</header>

<div class="wrap">
<main>
 <section class="recap noprint" aria-label="Rekap jurnal">
  <div class="it"><b id="rTotal">0</b><span>Total jurnal</span></div>
  <div class="it"><b id="rDays">0</b><span>Hari kegiatan</span></div>
  <div class="it"><b id="rHours">0</b><span>Total jam kerja</span></div>
  <div class="it"><b id="rShown">0</b><span>Tampil sesuai filter</span></div>
 </section>

 <div class="layout">
  <section class="card formcard" aria-labelledby="formTitle">
   <h2 id="formTitle">Tambah jurnal</h2>
   <form id="form" novalidate>
    <div class="f" data-f="tanggal"><label for="tanggal">Tanggal <span class="req">*</span></label>
     <input type="date" id="tanggal"><div class="err"></div></div>
    <div class="row2">
     <div class="f" data-f="mulai"><label for="mulai">Jam mulai <span class="req">*</span></label>
      <input type="time" id="mulai" value="08:00"><div class="err"></div></div>
     <div class="f" data-f="selesai"><label for="selesai">Jam selesai <span class="req">*</span></label>
      <input type="time" id="selesai" value="16:00"><div class="err"></div></div>
    </div>
    <div class="f" data-f="kegiatan"><label for="kegiatan">Kegiatan / pekerjaan <span class="req">*</span></label>
     <textarea id="kegiatan" placeholder="Contoh: Membuat halaman login dengan HTML dan CSS"></textarea><div class="err"></div></div>
    <div class="f" data-f="hasil"><label for="hasil">Hasil atau kompetensi yang dipelajari <span class="req">*</span></label>
     <textarea id="hasil" placeholder="Contoh: Memahami validasi form di sisi klien"></textarea><div class="err"></div></div>
    <div class="f" data-f="kendala"><label for="kendala">Kendala</label>
     <textarea id="kendala" placeholder="Kosongkan jika tidak ada"></textarea><div class="err"></div></div>
    <div class="f" data-f="rencana"><label for="rencana">Rencana tindak lanjut</label>
     <textarea id="rencana" placeholder="Kosongkan jika tidak ada"></textarea><div class="err"></div></div>
    <p class="hint">Tanda <span class="req">*</span> wajib diisi.</p>
    <div class="btns">
     <button class="btn primary" type="submit" id="btnSave">Simpan jurnal</button>
     <button class="btn" type="button" id="btnCancel" hidden>Batal edit</button>
     <button class="btn" type="button" id="btnClearForm">Kosongkan form</button>
    </div>
   </form>
  </section>

  <section class="card" aria-labelledby="listTitle">
   <div class="listhead">
    <h2 id="listTitle">Daftar jurnal</h2>
    <span class="count" id="count"></span>
   </div>
   <div class="tools noprint">
    <div><label for="q">Cari kegiatan, hasil, kendala, atau rencana</label>
     <input type="search" id="q" placeholder="Ketik kata kunci"></div>
    <div class="dates">
     <div><label for="dari">Dari tanggal</label><input type="date" id="dari"></div>
     <div><label for="sampai">Sampai tanggal</label><input type="date" id="sampai"></div>
    </div>
    <div class="btns">
     <button class="btn sm" type="button" id="btnReset">Reset filter</button>
     <button class="btn sm warn-o" type="button" id="btnSample" hidden>Hapus data contoh</button>
    </div>
   </div>
   <p class="pnote" id="pnote"></p>
   <div id="list"></div>
   <div class="psign">
    <div>Guru Pembimbing<br><br><br><br><u id="sGuru"></u></div>
    <div>Pembimbing Lapangan<br><br><br><br><u id="sPemb"></u></div>
   </div>
  </section>
 </div>
</main>
</div>

<div class="modal" id="mConfirm" hidden role="dialog" aria-modal="true" aria-labelledby="cTitle">
 <div class="box">
  <h2 id="cTitle">Konfirmasi</h2>
  <p id="cText"></p>
  <div class="btns">
   <button class="btn" type="button" id="cNo">Batal</button>
   <button class="btn danger" type="button" id="cYes">Ya, hapus</button>
  </div>
 </div>
</div>

<div class="modal" id="mIdent" hidden role="dialog" aria-modal="true" aria-labelledby="iTitle">
 <div class="box">
  <h2 id="iTitle">Ubah identitas siswa</h2>
  <form id="fIdent" novalidate>
   <div class="f" data-f="nama"><label for="iNama">Nama siswa <span class="req">*</span></label><input type="text" id="iNama"><div class="err"></div></div>
   <div class="f" data-f="kelas"><label for="iKelas">Kelas <span class="req">*</span></label><input type="text" id="iKelas"><div class="err"></div></div>
   <div class="f" data-f="tempat"><label for="iTempat">Tempat PKL <span class="req">*</span></label><input type="text" id="iTempat"><div class="err"></div></div>
   <div class="f" data-f="pemb"><label for="iPemb">Pembimbing lapangan <span class="req">*</span></label><input type="text" id="iPemb"><div class="err"></div></div>
   <div class="f" data-f="guru"><label for="iGuru">Guru pembimbing</label><input type="text" id="iGuru"><div class="err"></div></div>
   <div class="row2">
    <div class="f" data-f="pm"><label for="iMulai">Periode mulai <span class="req">*</span></label><input type="date" id="iMulai"><div class="err"></div></div>
    <div class="f" data-f="ps"><label for="iSelesai">Periode selesai <span class="req">*</span></label><input type="date" id="iSelesai"><div class="err"></div></div>
   </div>
   <div class="btns">
    <button class="btn" type="button" id="iCancel">Batal</button>
    <button class="btn primary" type="submit">Simpan identitas</button>
   </div>
  </form>
 </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';
var KEY='jurnalPKL.v1.entries', IDK='jurnalPKL.v1.identitas';
var $=function(id){return document.getElementById(id)};
var storageOK=true;

var DEF_IDENT={nama:'Siswa Contoh (data fiktif)',kelas:'XII RPL 1',tempat:'PT Contoh Teknologi Nusantara (fiktif)',pemb:'Bapak Pembimbing Contoh',guru:'Ibu Guru Contoh',pm:'2026-10-05',ps:'2027-01-29'};
var SAMPLES=[
 {id:'s1',sample:true,tanggal:'2026-10-19',mulai:'08:00',selesai:'16:00',kegiatan:'Pengenalan lingkungan kerja dan penyusunan akun pengembangan.',hasil:'Memahami alur kerja tim dan penggunaan Git dasar.',kendala:'Belum terbiasa dengan perintah terminal.',rencana:'Berlatih perintah Git setiap hari.'},
 {id:'s2',sample:true,tanggal:'2026-10-20',mulai:'08:00',selesai:'16:00',kegiatan:'Membuat halaman daftar produk dengan HTML dan CSS.',hasil:'Mampu menyusun layout responsif memakai flexbox dan grid.',kendala:'',rencana:'Menambahkan fitur pencarian produk.'},
 {id:'s3',sample:true,tanggal:'2026-10-21',mulai:'08:30',selesai:'15:30',kegiatan:'Menambahkan validasi form pada halaman pendaftaran.',hasil:'Memahami validasi input dengan JavaScript.',kendala:'Pesan galat tampil ganda.',rencana:'Merapikan fungsi validasi agar bisa dipakai ulang.'}
];

function read(k,fb){try{var v=localStorage.getItem(k);return v===null?fb:JSON.parse(v)}catch(e){storageOK=false;return fb}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){storageOK=false;return false}}

var entries=read(KEY,null);
if(!Array.isArray(entries)){entries=SAMPLES.map(function(s){return Object.assign({},s)});write(KEY,entries)}
var ident=Object.assign({},DEF_IDENT,read(IDK,{}));
var editingId=null;

function persist(){
 if(!write(KEY,entries)){toast('Gagal menyimpan ke penyimpanan browser. Data hanya tersimpan sementara.','bad');return false}
 return true;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function fmtD(s,long){if(!s)return '-';return parseD(s).toLocaleDateString('id-ID',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'long',year:'numeric'})}
function mins(e){var a=e.mulai.split(':'),b=e.selesai.split(':');return Math.max(0,(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]))}
function fmtDur(m){var h=Math.floor(m/60),r=m%60;return h+' j'+(r?' '+r+' m':'')}

function toast(msg,type){
 var t=document.createElement('div');t.className='toast '+(type||'info');t.textContent=msg;
 $('toasts').appendChild(t);setTimeout(function(){t.remove()},4200);
}

/* ---------- Identitas ---------- */
function renderIdent(){
 var rows=[['Nama siswa',ident.nama],['Kelas',ident.kelas],['Tempat PKL',ident.tempat],['Pembimbing lapangan',ident.pemb],['Guru pembimbing',ident.guru||'-'],['Periode PKL',fmtD(ident.pm)+' s.d. '+fmtD(ident.ps)]];
 $('ident').innerHTML=rows.map(function(r){return '<div><dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd></div>'}).join('');
 $('sGuru').textContent=ident.guru||'..............................';
 $('sPemb').textContent=ident.pemb;
}

/* ---------- Validasi ---------- */
function setErr(box,field,msg){
 var f=box.querySelector('[data-f="'+field+'"]');if(!f)return;
 f.classList.toggle('invalid',!!msg);f.querySelector('.err').textContent=msg||'';
}
function clearErr(box){box.querySelectorAll('.f').forEach(function(f){f.classList.remove('invalid');f.querySelector('.err').textContent=''})}
function firstInvalid(box){var f=box.querySelector('.invalid input,.invalid textarea');if(f)f.focus()}

function validateEntry(v){
 var ok=true;function bad(f,m){setErr($('form'),f,m);ok=false}
 clearErr($('form'));
 if(!v.tanggal)bad('tanggal','Tanggal wajib diisi.');
 if(!v.mulai)bad('mulai','Jam mulai wajib diisi.');
 if(!v.selesai)bad('selesai','Jam selesai wajib diisi.');
 else if(v.mulai&&v.selesai<=v.mulai)bad('selesai','Jam selesai harus setelah jam mulai.');
 if(v.kegiatan.length<10)bad('kegiatan','Kegiatan wajib diisi, minimal 10 karakter.');
 if(v.hasil.length<5)bad('hasil','Hasil atau kompetensi wajib diisi, minimal 5 karakter.');
 return ok;
}

/* ---------- Form jurnal ---------- */
function resetForm(){
 editingId=null;$('form').reset();clearErr($('form'));
 $('tanggal').value=today();$('mulai').value='08:00';$('selesai').value='16:00';
 $('formTitle').textContent='Tambah jurnal';$('btnSave').textContent='Simpan jurnal';$('btnCancel').hidden=true;
 render();
}
$('form').addEventListener('submit',function(ev){
 ev.preventDefault();
 var v={tanggal:$('tanggal').value,mulai:$('mulai').value,selesai:$('selesai').value,
  kegiatan:$('kegiatan').value.trim(),hasil:$('hasil').value.trim(),kendala:$('kendala').value.trim(),rencana:$('rencana').value.trim()};
 if(!validateEntry(v)){toast('Jurnal belum disimpan. Periksa kolom yang ditandai merah.','bad');firstInvalid($('form'));return}
 if(editingId){
  var i=entries.findIndex(function(e){return e.id===editingId});
  if(i<0){toast('Data yang diedit tidak ditemukan.','bad');resetForm();return}
  entries[i]=Object.assign({},entries[i],v,{sample:false});
  if(persist())toast('Perubahan jurnal berhasil disimpan.','ok');
 }else{
  v.id=uid();entries.push(v);
  if(persist())toast('Jurnal baru berhasil ditambahkan.','ok');
 }
 resetForm();
});
$('btnCancel').addEventListener('click',function(){resetForm();toast('Edit dibatalkan.','info')});
$('btnClearForm').addEventListener('click',function(){resetForm()});

function startEdit(id){
 var e=entries.find(function(x){return x.id===id});if(!e)return;
 editingId=id;clearErr($('form'));
 $('tanggal').value=e.tanggal;$('mulai').value=e.mulai;$('selesai').value=e.selesai;
 $('kegiatan').value=e.kegiatan;$('hasil').value=e.hasil;$('kendala').value=e.kendala||'';$('rencana').value=e.rencana||'';
 $('formTitle').textContent='Edit jurnal';$('btnSave').textContent='Simpan perubahan';$('btnCancel').hidden=false;
 render();
 $('form').scrollIntoView({behavior:'smooth',block:'start'});$('kegiatan').focus({preventScroll:true});
}

/* ---------- Konfirmasi ---------- */
var onYes=null;
function confirmBox(title,text,yesLabel,cb){
 $('cTitle').textContent=title;$('cText').textContent=text;$('cYes').textContent=yesLabel;onYes=cb;
 $('mConfirm').hidden=false;$('cNo').focus();
}
function closeConfirm(){$('mConfirm').hidden=true;onYes=null}
$('cNo').addEventListener('click',closeConfirm);
$('cYes').addEventListener('click',function(){var f=onYes;closeConfirm();if(f)f()});

function deleteEntry(id){
 var e=entries.find(function(x){return x.id===id});if(!e)return;
 confirmBox('Hapus jurnal?','Jurnal tanggal '+fmtD(e.tanggal)+' akan dihapus permanen dan tidak dapat dikembalikan.','Ya, hapus',function(){
  entries=entries.filter(function(x){return x.id!==id});
  if(editingId===id)resetForm();
  if(persist())toast('Jurnal berhasil dihapus.','ok');
  render();
 });
}
$('btnSample').addEventListener('click',function(){
 confirmBox('Hapus data contoh?','Semua jurnal bertanda "Contoh" akan dihapus. Jurnal yang kamu buat sendiri tidak ikut terhapus.','Ya, hapus contoh',function(){
  entries=entries.filter(function(x){return !x.sample});
  if(editingId&&!entries.some(function(x){return x.id===editingId}))resetForm();
  if(persist())toast('Data contoh berhasil dihapus.','ok');
  render();
 });
});

/* ---------- Daftar, cari, filter ---------- */
function filtered(){
 var q=$('q').value.trim().toLowerCase(),d1=$('dari').value,d2=$('sampai').value;
 return entries.filter(function(e){
  if(d1&&e.tanggal<d1)return false;
  if(d2&&e.tanggal>d2)return false;
  if(q){var t=(e.kegiatan+' '+e.hasil+' '+e.kendala+' '+e.rencana).toLowerCase();if(t.indexOf(q)<0)return false}
  return true;
 }).sort(function(a,b){return a.tanggal===b.tanggal?(b.mulai>a.mulai?1:-1):(b.tanggal>a.tanggal?1:-1)});
}
function render(){
 var list=filtered(),box=$('list');
 var days={},tot=0;entries.forEach(function(e){days[e.tanggal]=1;tot+=mins(e)});
 $('rTotal').textContent=entries.length;$('rDays').textContent=Object.keys(days).length;
 $('rHours').textContent=fmtDur(tot);$('rShown').textContent=list.length;
 $('count').textContent='Menampilkan '+list.length+' dari '+entries.length+' jurnal';
 $('btnSample').hidden=!entries.some(function(e){return e.sample});
 var on=$('q').value||$('dari').value||$('sampai').value;
 $('pnote').textContent=on?'Catatan: hanya menampilkan jurnal sesuai filter ('+list.length+' dari '+entries.length+').':'';
 if(!entries.length){
  box.innerHTML='<div class="empty"><h3>Belum ada jurnal</h3><p>Isi form di sebelah atas untuk mencatat kegiatan PKL pertamamu.</p></div>';return;
 }
 if(!list.length){
  box.innerHTML='<div class="empty"><h3>Tidak ada jurnal yang cocok</h3><p>Ubah kata kunci atau rentang tanggal, atau tekan Reset filter.</p></div>';return;
 }
 box.innerHTML=list.map(function(e){
  return '<article class="entry'+(e.id===editingId?' editing':'')+'">'+
  '<div class="meta"><span class="date">'+esc(fmtD(e.tanggal,true))+(e.sample?'<span class="tag">Contoh</span>':'')+'</span>'+
  '<span class="time">'+esc(e.mulai)+' - '+esc(e.selesai)+' ('+fmtDur(mins(e))+')</span></div>'+
  '<dl><div><dt>Kegiatan</dt><dd>'+esc(e.kegiatan)+'</dd></div>'+
  '<div><dt>Hasil / kompetensi</dt><dd>'+esc(e.hasil)+'</dd></div>'+
  '<div><dt>Kendala</dt><dd>'+esc(e.kendala||'-')+'</dd></div>'+
  '<div><dt>Rencana tindak lanjut</dt><dd>'+esc(e.rencana||'-')+'</dd></div></dl>'+
  '<div class="ea"><button class="btn sm" type="button" data-act="edit" data-id="'+esc(e.id)+'">Edit</button>'+
  '<button class="btn sm warn-o" type="button" data-act="del" data-id="'+esc(e.id)+'">Hapus</button></div></article>';
 }).join('');
}
$('list').addEventListener('click',function(ev){
 var b=ev.target.closest('button[data-act]');if(!b)return;
 if(b.dataset.act==='edit')startEdit(b.dataset.id);else deleteEntry(b.dataset.id);
});
['q','dari','sampai'].forEach(function(id){$(id).addEventListener('input',render)});
$('btnReset').addEventListener('click',function(){$('q').value='';$('dari').value='';$('sampai').value='';render();toast('Filter direset.','info')});
$('dari').addEventListener('change',function(){if($('sampai').value&&$('dari').value>$('sampai').value)toast('Tanggal "Dari" lebih besar dari "Sampai". Hasil kosong.','bad')});

/* ---------- Identitas modal ---------- */
function openIdent(){
 clearErr($('fIdent'));
 $('iNama').value=ident.nama;$('iKelas').value=ident.kelas;$('iTempat').value=ident.tempat;
 $('iPemb').value=ident.pemb;$('iGuru').value=ident.guru;$('iMulai').value=ident.pm;$('iSelesai').value=ident.ps;
 $('mIdent').hidden=false;$('iNama').focus();
}
$('btnIdent').addEventListener('click',openIdent);
$('iCancel').addEventListener('click',function(){$('mIdent').hidden=true});
$('fIdent').addEventListener('submit',function(ev){
 ev.preventDefault();var ok=true,f=$('fIdent');clearErr(f);
 var v={nama:$('iNama').value.trim(),kelas:$('iKelas').value.trim(),tempat:$('iTempat').value.trim(),pemb:$('iPemb').value.trim(),guru:$('iGuru').value.trim(),pm:$('iMulai').value,ps:$('iSelesai').value};
 function bad(k,m){setErr(f,k,m);ok=false}
 if(!v.nama)bad('nama','Nama siswa wajib diisi.');
 if(!v.kelas)bad('kelas','Kelas wajib diisi.');
 if(!v.tempat)bad('tempat','Tempat PKL wajib diisi.');
 if(!v.pemb)bad('pemb','Nama pembimbing wajib diisi.');
 if(!v.pm)bad('pm','Tanggal mulai wajib diisi.');
 if(!v.ps)bad('ps','Tanggal selesai wajib diisi.');
 else if(v.pm&&v.ps<v.pm)bad('ps','Tanggal selesai tidak boleh sebelum tanggal mulai.');
 if(!ok){toast('Identitas belum disimpan. Periksa kolom yang ditandai merah.','bad');firstInvalid(f);return}
 ident=v;
 if(write(IDK,ident))toast('Identitas berhasil disimpan.','ok');else toast('Gagal menyimpan identitas ke browser.','bad');
 $('mIdent').hidden=true;renderIdent();
});

/* ---------- Cetak & tombol umum ---------- */
$('btnPrint').addEventListener('click',function(){
 if(!entries.length){toast('Belum ada jurnal untuk dicetak.','bad');return}
 if(!filtered().length){toast('Tidak ada jurnal yang tampil. Reset filter sebelum mencetak.','bad');return}
 window.print();
});
document.addEventListener('keydown',function(ev){
 if(ev.key==='Escape'){closeConfirm();$('mIdent').hidden=true}
});
['mConfirm','mIdent'].forEach(function(id){
 $(id).addEventListener('click',function(ev){if(ev.target===this){closeConfirm();$('mIdent').hidden=true}});
});

/* ---------- Mulai ---------- */
renderIdent();resetForm();
if(!storageOK)toast('Penyimpanan browser tidak tersedia (mode privat atau diblokir). Data akan hilang saat halaman ditutup.','bad');
})();
</script>
</body>
</html>
